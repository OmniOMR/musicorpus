[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicorpus"]

# The lmx dependency is a git URL rather than a PyPI release, which a build
# refuses to accept unless this says otherwise. It is also what will have to go
# before this package can be published to PyPI, which rejects direct
# references outright — see docs/versioning-and-releases.md.
[tool.hatch.metadata]
allow-direct-references = true

# The version is read from the git tags rather than written down here, so that
# every commit builds as a distinct version — see docs/versioning-and-releases.md.
#
# `--match v[0-9]*` is not the default and is load-bearing: this repository
# publishes the *specification* under tags of its own, and a tag like
# `specification-1.1` would otherwise be matched by setuptools-scm's default
# `--match *[0-9]*` and read as the version of the code. The two release
# streams share a tag namespace, so the code has to say which tags are its own.
[tool.hatch.version]
source = "vcs"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match v[0-9]* --abbrev=8" }

[project]
name = "musicorpus"
dynamic = ["version"]
authors = [
  { name="Jiří Mayer", email="mayer@ufal.mff.cuni.cz" },
]
# TODO: these are the requirements.txt dependencies carried over verbatim. Most
# of them belong to the validator or to the dataset exporters, not to reading a
# dataset, and they are split into extras in a commit of their own.
dependencies = [
    "requests",
    "opencv-python",
    "tqdm",
    "mung==1.2.1",
    # "linearized-musicxml==1.0.0"
    # Instead, we use the in-development 2.0.0 version:
    "linearized-musicxml @ git+https://github.com/OMR-Research/lmx.git@8648514f5bfa08c594277b2d7821a156c75dd299",
    "pycocotools",
    "pyyaml",
    "imagesize==2.0.0",
    "music21",
    "converter21",
]
description = "Tools for building and consuming datasets in the MusiCorpus format"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# No upper bound, unlike Zeus: nothing here is tied to a python release, so the
# package should install on whatever the user already has. The floor is 3.10
# because the codebase writes `X | None` in annotations that are evaluated at
# runtime, and because 3.9 has been end-of-life since October 2025.
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/OmniOMR/musicorpus"
Issues = "https://github.com/OmniOMR/musicorpus/issues"

# `scripts`, not `gui-scripts`. The two behave alike on Linux, but a gui-script
# is built as a no-console executable on Windows, where a CLI would then print
# nowhere at all.
[project.scripts]
musicorpus = "musicorpus.cli.run:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# The rule set is named rather than left to ruff's default, because that
# default is not stable across ruff versions: 0.16 enables some 415 rules where
# earlier releases enabled a few dozen, so an unpinned selection means two
# developers on two ruff versions see two different code bases. `dev` allows
# `ruff>=0.6`, so this has to be said out loud.
[tool.ruff.lint]
select = [
    "E",       # pycodestyle — including bare `except:`
    "F",       # pyflakes — unused imports and names, real mistakes
    "I",       # import sorting
    "UP",      # constructs made obsolete by the python version we require
    "B",       # bugbear — likely bugs rather than style
    "SIM",     # simplifications that remove a branch or a temporary
    "C4",      # comprehensions written the long way
    "PLR1722", # `exit()` instead of `sys.exit()`; `exit` is installed by the
               # `site` module and is simply absent under `python -S`, which
               # would turn a clean CLI exit into a NameError
]

# Deliberately not `strict = true`. mung, pycocotools, music21, converter21 and
# cv2 ship no type information, and this code was written without annotations
# in places, so strict mode would report hundreds of errors that say nothing
# about correctness. These settings catch real mistakes inside the functions we
# have; the screws can be tightened as annotations arrive — and they should be
# tightened here further than in Zeus, because this package is meant to be
# imported by other people.
#
# No `python_version` here, unlike Zeus, which is pinned to exactly one. This
# package supports a range, so mypy should check against whichever interpreter
# it runs on — that is what makes the CI matrix worth having. Pinning it to
# 3.10 also makes mypy choke on the 3.12 numpy stubs, which use `type`
# statements it then refuses to parse.
[tool.mypy]
files = ["src/musicorpus", "tests"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
